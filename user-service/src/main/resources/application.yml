spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${USER_POSTGRES_HOST:${POSTGRES_HOST:localhost}}:${USER_POSTGRES_PORT:${POSTGRES_PORT:5435}}/${USER_POSTGRES_DB:hotel_user}
    username: ${POSTGRES_USER:hms_user}
    password: ${POSTGRES_PASSWORD:hms_local_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${USER_SERVICE_PORT:8088}

logging:
  level:
    com.hotelbooking: INFO
