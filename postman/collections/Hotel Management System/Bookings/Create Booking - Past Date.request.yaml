$kind: http-request
name: Create Booking - Past Date
method: POST
url: '{{baseUrl}}/api/bookings'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": 1,
      "roomId": 3,
      "checkInDate": "2024-01-01",
      "checkOutDate": "2024-01-05"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Response field 'status' equals 400", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.status).to.eql(400);
      });

      pm.test("Response field 'message' contains 'past'", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.message).to.include("past");
      });
