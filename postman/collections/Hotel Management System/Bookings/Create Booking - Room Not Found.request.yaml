$kind: http-request
name: Create Booking - Room Not Found
method: POST
url: '{{baseUrl}}/api/bookings'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": 1,
      "roomId": 99999,
      "checkInDate": "2026-10-01",
      "checkOutDate": "2026-10-05"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 404", function () {
        pm.response.to.have.status(404);
      });

      pm.test("Response field 'status' equals 404", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.status).to.eql(404);
      });

      pm.test("Response field 'message' contains '99999'", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.message).to.include("99999");
      });
