$kind: http-request
name: Get Hotel by ID - Not Found
method: GET
url: '{{baseUrl}}/api/hotels/99999'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 404", function () {
        pm.response.to.have.status(404);
      });

      pm.test("Response body has field 'status' equal to 404", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.status).to.eql(404);
      });

      pm.test("Response body has field 'error' equal to 'Not Found'", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.error).to.eql("Not Found");
      });

      pm.test("Response body has field 'message' that contains '99999'", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.message).to.include("99999");
      });
