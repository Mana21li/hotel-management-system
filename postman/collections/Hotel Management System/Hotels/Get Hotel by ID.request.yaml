$kind: http-request
name: Get Hotel by ID
method: GET
url: '{{baseUrl}}/api/hotels/1'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has id equal to 1", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.id).to.eql(1);
      });

      pm.test("Response has fields: id, name, addressLine, starRating", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.have.property('id');
        pm.expect(jsonData).to.have.property('name');
        pm.expect(jsonData).to.have.property('addressLine');
        pm.expect(jsonData).to.have.property('starRating');
      });

      pm.test("name is 'The Taj Seaside'", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.name).to.eql("The Taj Seaside");
      });

      pm.test("starRating is 5", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.starRating).to.eql(5);
      });

      pm.test("Response time is less than 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
