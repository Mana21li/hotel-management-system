spring:
  application:
    name: hotel-service

  datasource:
    url: jdbc:postgresql://${HOTEL_POSTGRES_HOST:${POSTGRES_HOST:localhost}}:${HOTEL_POSTGRES_PORT:${POSTGRES_PORT:5433}}/${HOTEL_POSTGRES_DB:hotel_catalog}
    username: ${POSTGRES_USER:hms_user}
    password: ${POSTGRES_PASSWORD:hms_local_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

server:
  port: ${HOTEL_SERVICE_PORT:8086}

logging:
  level:
    com.hotelbooking.hotel: INFO
