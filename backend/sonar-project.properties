# SonarQube Community Edition project settings (analyzed in CI — Milestone 4).
# Host URL + token are provided by CI / local scanner — not committed secrets.

sonar.projectKey=hotel-management-system
sonar.projectName=hotel-management-system

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.exclusions=**/dto/**
