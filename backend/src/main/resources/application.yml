# Strangler/gateway only — no datasource, Redis, or Kafka on this process.
spring:
  application:
    name: hotel-booking-api

# Public paths stay here and are forwarded to extracted services.
search:
  service:
    base-url: ${SEARCH_SERVICE_URL:http://127.0.0.1:8083}

hotel:
  service:
    base-url: ${HOTEL_SERVICE_URL:http://127.0.0.1:8086}

booking:
  service:
    base-url: ${BOOKING_SERVICE_URL:http://127.0.0.1:8087}

server:
  port: 8080

logging:
  level:
    com.hotelbooking: INFO
