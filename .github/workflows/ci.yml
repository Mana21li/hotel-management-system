# Continuous Integration — Stage 4 Milestone 4
#
# Gates (no deploy):
#   1. Unit tests
#   2. Integration tests (against compose infra)
#   3. Jacoco coverage + SonarQube Community Edition analysis
#   4. Boot jar build
#   5. Docker image build (not pushed)
#
# SonarQube CE runs in Docker (compose profile "sonar"). No SonarCloud account
# or GitHub secrets required — CI bootstraps an analysis token on a fresh instance.
#
# Note: use 127.0.0.1 (not localhost) for host→container ports on GitHub runners.
# "localhost" often resolves to IPv6 (::1) while Docker publishes IPv4 only.

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Unit → Integration → SonarQube CE → Build → Docker
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # 1. Unit tests (no Docker)
      # ------------------------------------------------------------------
      - name: Unit tests
        run: ./gradlew test --console=plain

      # ------------------------------------------------------------------
      # 2. Integration tests (Docker infra on the runner)
      # ------------------------------------------------------------------
      - name: Create CI .env for compose
        working-directory: .
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=hms_user
          POSTGRES_PASSWORD=hms_local_password
          HOTEL_POSTGRES_PORT=5433
          BOOKING_POSTGRES_PORT=5434
          USER_POSTGRES_PORT=5435
          HOTEL_POSTGRES_DB=hotel_catalog
          BOOKING_POSTGRES_DB=hotel_booking
          USER_POSTGRES_DB=hotel_user
          POSTGRES_PORT=5432
          REDIS_PORT=6379
          ELASTICSEARCH_PORT=9200
          ELASTICSEARCH_URI=http://127.0.0.1:9200
          KIBANA_PORT=5601
          KAFKA_PORT=9092
          KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092
          KAFKA_UI_PORT=8081
          APP_PORT=8080
          SONARQUBE_PORT=9000
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Start infrastructure (Postgres, Redis, ES, Kafka)
        working-directory: .
        run: docker compose up -d user-db hotel-db booking-db redis elasticsearch kafka

      - name: Wait for healthy infrastructure
        working-directory: .
        run: |
          echo "Waiting for compose services to become healthy..."
          for i in $(seq 1 60); do
            user_db=$(docker inspect -f '{{.State.Health.Status}}' hms_user_db 2>/dev/null || echo starting)
            hotel_db=$(docker inspect -f '{{.State.Health.Status}}' hms_hotel_db 2>/dev/null || echo starting)
            booking_db=$(docker inspect -f '{{.State.Health.Status}}' hms_booking_db 2>/dev/null || echo starting)
            redis=$(docker inspect -f '{{.State.Health.Status}}' hms_redis 2>/dev/null || echo starting)
            es=$(docker inspect -f '{{.State.Health.Status}}' hms_elasticsearch 2>/dev/null || echo starting)
            kafka=$(docker inspect -f '{{.State.Health.Status}}' hms_kafka 2>/dev/null || echo starting)
            echo "attempt $i: user_db=$user_db hotel_db=$hotel_db booking_db=$booking_db redis=$redis es=$es kafka=$kafka"
            if [ "$user_db" = healthy ] && [ "$hotel_db" = healthy ] && [ "$booking_db" = healthy ] && [ "$redis" = healthy ] && [ "$es" = healthy ] && [ "$kafka" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Infra did not become healthy in time"
          docker compose ps
          docker compose logs --tail=80
          exit 1

      - name: Create Elasticsearch hotels index + alias
        working-directory: .
        run: |
          set -e
          # Wait until the published host port actually answers (health ≠ host port race).
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:9200" >/dev/null; then
              break
            fi
            echo "ES host port not ready yet ($i)"
            sleep 2
          done
          curl -fsS "http://127.0.0.1:9200" | head -c 200; echo

          # Idempotent create: delete leftover index/alias, then apply mapping.
          curl -sS -o /dev/null -X DELETE "http://127.0.0.1:9200/hotels_v1" || true
          curl -sS -o /dev/null -X DELETE "http://127.0.0.1:9200/hotels" || true

          HTTP=$(curl -sS -o /tmp/es-create.json -w '%{http_code}' -X PUT "http://127.0.0.1:9200/hotels_v1" \
            -H 'Content-Type: application/json' \
            --data-binary @es/hotels-index.json)
          echo "Create hotels_v1 HTTP $HTTP"
          cat /tmp/es-create.json; echo
          if [ "$HTTP" != "200" ]; then
            exit 1
          fi

      - name: Notification service tests
        working-directory: notification-service
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092

      - name: Start notification service for E2E
        working-directory: notification-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/notification-service.log 2>&1 &
          echo $! > /tmp/notification-service.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8082/internal/stats >/dev/null; then
              echo "notification-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/notification-service.log
          exit 1
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          NOTIFICATION_SERVICE_PORT: '8082'

      - name: Analytics service tests
        working-directory: analytics-service
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092

      - name: Start analytics service for E2E
        working-directory: analytics-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/analytics-service.log 2>&1 &
          echo $! > /tmp/analytics-service.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8084/internal/stats >/dev/null; then
              echo "analytics-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/analytics-service.log
          exit 1
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          ANALYTICS_SERVICE_PORT: '8084'

      - name: Recommendation service tests
        working-directory: recommendation-service
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092

      - name: Start recommendation service for E2E
        working-directory: recommendation-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/recommendation-service.log 2>&1 &
          echo $! > /tmp/recommendation-service.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8085/internal/stats >/dev/null; then
              echo "recommendation-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/recommendation-service.log
          exit 1
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          RECOMMENDATION_SERVICE_PORT: '8085'

      - name: User service tests
        working-directory: user-service
        run: |
          chmod +x gradlew
          ./gradlew test integrationTest --console=plain
        env:
          USER_POSTGRES_HOST: 127.0.0.1
          USER_POSTGRES_PORT: '5435'
          USER_POSTGRES_DB: hotel_user
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_local_password

      - name: Start user service for E2E
        working-directory: user-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/user-service.log 2>&1 &
          echo $! > /tmp/user-service.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/internal/health >/dev/null; then
              echo "user-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/user-service.log
          exit 1
        env:
          USER_POSTGRES_HOST: 127.0.0.1
          USER_POSTGRES_PORT: '5435'
          USER_POSTGRES_DB: hotel_user
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_local_password
          USER_SERVICE_PORT: '8088'

      - name: Hotel service tests
        working-directory: hotel-service
        run: |
          chmod +x gradlew
          ./gradlew test integrationTest --console=plain
        env:
          HOTEL_POSTGRES_HOST: 127.0.0.1
          HOTEL_POSTGRES_PORT: '5433'
          HOTEL_POSTGRES_DB: hotel_catalog
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_local_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'

      - name: Start hotel service for E2E
        working-directory: hotel-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/hotel-service.log 2>&1 &
          echo $! > /tmp/hotel-service.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8086/api/hotels >/dev/null; then
              echo "hotel-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/hotel-service.log
          exit 1
        env:
          HOTEL_POSTGRES_HOST: 127.0.0.1
          HOTEL_POSTGRES_PORT: '5433'
          HOTEL_POSTGRES_DB: hotel_catalog
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_local_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          HOTEL_SERVICE_PORT: '8086'

      - name: Search service tests
        working-directory: search-service
        run: |
          chmod +x gradlew
          ./gradlew test integrationTest --console=plain
        env:
          HOTEL_SERVICE_URL: http://127.0.0.1:8086
          ELASTICSEARCH_URI: http://127.0.0.1:9200
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092

      - name: Start search service for E2E
        working-directory: search-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/search-service.log 2>&1 &
          echo $! > /tmp/search-service.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8083/internal/stats >/dev/null; then
              echo "search-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/search-service.log
          exit 1
        env:
          HOTEL_SERVICE_URL: http://127.0.0.1:8086
          ELASTICSEARCH_URI: http://127.0.0.1:9200
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          SEARCH_SERVICE_PORT: '8083'

      - name: Booking service tests
        working-directory: booking-service
        run: |
          chmod +x gradlew
          ./gradlew test integrationTest --console=plain
        env:
          BOOKING_POSTGRES_HOST: 127.0.0.1
          BOOKING_POSTGRES_PORT: '5434'
          BOOKING_POSTGRES_DB: hotel_booking
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_local_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          HOTEL_SERVICE_URL: http://127.0.0.1:8086
          USER_SERVICE_URL: http://127.0.0.1:8088

      - name: Start booking service for E2E
        working-directory: booking-service
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar build/libs/*.jar > /tmp/booking-service.log 2>&1 &
          echo $! > /tmp/booking-service.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8087/internal/health >/dev/null; then
              echo "booking-service is up"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/booking-service.log
          exit 1
        env:
          BOOKING_POSTGRES_HOST: 127.0.0.1
          BOOKING_POSTGRES_PORT: '5434'
          BOOKING_POSTGRES_DB: hotel_booking
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_local_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          HOTEL_SERVICE_URL: http://127.0.0.1:8086
          USER_SERVICE_URL: http://127.0.0.1:8088
          BOOKING_SERVICE_PORT: '8087'

      - name: Integration tests
        run: ./gradlew integrationTest --console=plain
        env:
          SEARCH_SERVICE_URL: http://127.0.0.1:8083
          HOTEL_SERVICE_URL: http://127.0.0.1:8086
          BOOKING_SERVICE_URL: http://127.0.0.1:8087

      - name: E2E tests (strangler → extracted services)
        run: ./gradlew e2eTest --console=plain
        env:
          SEARCH_SERVICE_URL: http://127.0.0.1:8083
          HOTEL_SERVICE_URL: http://127.0.0.1:8086
          BOOKING_SERVICE_URL: http://127.0.0.1:8087
          NOTIFICATION_SERVICE_URL: http://127.0.0.1:8082
          ANALYTICS_SERVICE_URL: http://127.0.0.1:8084
          RECOMMENDATION_SERVICE_URL: http://127.0.0.1:8085

      # ------------------------------------------------------------------
      # 3. Coverage + SonarQube Community Edition (self-hosted)
      # ------------------------------------------------------------------
      - name: Jacoco coverage reports (all modules)
        working-directory: .
        run: |
          for dir in backend notification-service analytics-service recommendation-service search-service hotel-service booking-service user-service; do
            echo "=== Jacoco: $dir ==="
            (cd "$dir" && chmod +x gradlew && ./gradlew jacocoTestReport --console=plain)
          done

      - name: Start SonarQube Community Edition
        working-directory: .
        run: docker compose --profile sonar up -d sonar_db sonarqube

      - name: Wait for SonarQube UP
        working-directory: .
        run: |
          echo "Waiting for SonarQube Community Edition (cold start can take 2–3 minutes)..."
          for i in $(seq 1 90); do
            status=$(curl -fsS http://127.0.0.1:9000/api/system/status 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || echo STARTING)
            echo "attempt $i: status=$status"
            if [ "$status" = "UP" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose --profile sonar logs --tail=100 sonarqube
          exit 1

      - name: Bootstrap SonarQube analysis token
        id: sonar_token
        working-directory: .
        run: |
          # Fresh CE requires changing the default admin password before token APIs work.
          curl -fsS -u admin:admin -X POST \
            "http://127.0.0.1:9000/api/users/change_password?login=admin&previousPassword=admin&password=AdminChangeMe1!" \
            || true

          TOKEN=$(curl -fsS -u admin:AdminChangeMe1! -X POST \
            "http://127.0.0.1:9000/api/user_tokens/generate" \
            -d "name=ci-${GITHUB_RUN_ID}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')

          if [ -z "$TOKEN" ]; then
            echo "Failed to create SonarQube token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Run scanner on the runner (not in a nested Docker action) so 127.0.0.1:9000 works.
      - name: Install SonarScanner CLI
        working-directory: .
        run: |
          SCANNER_VERSION=7.0.2.4839
          curl -sSLo /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          unzip -q /tmp/sonar-scanner.zip -d /tmp
          echo "/tmp/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: SonarQube Community Edition analysis (all modules)
        working-directory: .
        env:
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}
          SONAR_HOST_URL: http://127.0.0.1:9000
        run: |
          for dir in backend notification-service analytics-service recommendation-service search-service hotel-service booking-service user-service; do
            echo "=== Sonar: $dir ==="
            (cd "$dir" && sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN")
          done

      # ------------------------------------------------------------------
      # 4. Build artifact
      # ------------------------------------------------------------------
      - name: Build boot jar
        run: ./gradlew bootJar -x test --console=plain

      # ------------------------------------------------------------------
      # 5. Docker image build (not pushed — no deploy in Milestone 4)
      # ------------------------------------------------------------------
      - name: Docker build (no push)
        working-directory: .
        run: |
          docker build -t hotel-booking-api:${{ github.sha }} ./backend
          docker build -t notification-service:${{ github.sha }} ./notification-service
          docker build -t search-service:${{ github.sha }} ./search-service
          docker build -t analytics-service:${{ github.sha }} ./analytics-service
          docker build -t recommendation-service:${{ github.sha }} ./recommendation-service
          docker build -t hotel-service:${{ github.sha }} ./hotel-service
          docker build -t booking-service:${{ github.sha }} ./booking-service
          docker build -t user-service:${{ github.sha }} ./user-service

      - name: Stop extracted services
        if: always()
        run: |
          if [ -f /tmp/notification-service.pid ]; then
            kill "$(cat /tmp/notification-service.pid)" || true
          fi
          if [ -f /tmp/search-service.pid ]; then
            kill "$(cat /tmp/search-service.pid)" || true
          fi
          if [ -f /tmp/analytics-service.pid ]; then
            kill "$(cat /tmp/analytics-service.pid)" || true
          fi
          if [ -f /tmp/recommendation-service.pid ]; then
            kill "$(cat /tmp/recommendation-service.pid)" || true
          fi
          if [ -f /tmp/hotel-service.pid ]; then
            kill "$(cat /tmp/hotel-service.pid)" || true
          fi
          if [ -f /tmp/booking-service.pid ]; then
            kill "$(cat /tmp/booking-service.pid)" || true
          fi
          if [ -f /tmp/user-service.pid ]; then
            kill "$(cat /tmp/user-service.pid)" || true
          fi

      - name: Tear down infrastructure
        if: always()
        working-directory: .
        run: docker compose --profile sonar --profile app down -v
