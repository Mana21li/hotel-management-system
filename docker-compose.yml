# Docker Compose configuration for the Hotel Management System.
#
# Services: PostgreSQL, Redis, Elasticsearch, Kafka (+ optional app / SonarQube CE).
# Run everything with:
#
#     docker compose up -d                              # infra only
#     docker compose --profile app up -d --build        # + strangler (:8080) + extracted services
#     docker compose --profile sonar up -d              # + SonarQube CE (http://localhost:9000)
#     docker compose ps
#     docker compose down                               # stop (volumes preserved)
#     docker compose --profile sonar --profile app down -v  # stop AND wipe volumes
#
# Credentials are read from the .env file (which is gitignored). See
# .env.example for the template.

services:
  app:
    # Public API strangler/gateway on :8080 (RestClient proxies only).
    # No Postgres, Redis, Elasticsearch, or Kafka in this process.
    #
    # Behind a compose PROFILE so the default workflow is unchanged:
    #     docker compose up -d                     → infra only (app via ./gradlew bootRun)
    #     docker compose --profile app up -d --build  → infra + containerized app
    build: ./backend

    container_name: hms_app

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      SEARCH_SERVICE_URL: http://search-service:8083
      HOTEL_SERVICE_URL: http://hotel-service:8086
      BOOKING_SERVICE_URL: http://booking-service:8087

    depends_on:
      search-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy

    # TCP check via bash (the JRE image has no curl/wget).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  notification-service:
    # Extracted notification consumer (Stage 4, Milestone 5).
    #   docker compose --profile app up -d --build
    build: ./notification-service

    container_name: hms_notification

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8082}:8082"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      NOTIFICATION_SERVICE_PORT: 8082

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  analytics-service:
    # Extracted analytics consumer (Stage 4, Milestone 6).
    build: ./analytics-service

    container_name: hms_analytics

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${ANALYTICS_SERVICE_PORT:-8084}:8084"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      ANALYTICS_SERVICE_PORT: 8084

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8084' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  recommendation-service:
    # Extracted recommendation consumer (Stage 4, Milestone 6).
    build: ./recommendation-service

    container_name: hms_recommendation

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${RECOMMENDATION_SERVICE_PORT:-8085}:8085"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      RECOMMENDATION_SERVICE_PORT: 8085

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8085' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  search-service:
    # Extracted search / ES read model (Stage 4, Milestone 6).
    build: ./search-service

    container_name: hms_search

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${SEARCH_SERVICE_PORT:-8083}:8083"

    environment:
      HOTEL_SERVICE_URL: http://hotel-service:8086
      ELASTICSEARCH_URI: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      SEARCH_SERVICE_PORT: 8083

    depends_on:
      hotel-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  user-service:
    # Extracted user profiles (Stage 4, post DB-per-service).
    build: ./user-service

    container_name: hms_user

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${USER_SERVICE_PORT:-8088}:8088"

    environment:
      USER_POSTGRES_DB: hotel_user
      USER_POSTGRES_HOST: user-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVICE_PORT: 8088

    depends_on:
      user-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8088' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  hotel-service:
    # Extracted hotel catalog (Stage 4, Milestone 6).
    build: ./hotel-service

    container_name: hms_hotel

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${HOTEL_SERVICE_PORT:-8086}:8086"

    environment:
      HOTEL_POSTGRES_DB: hotel_catalog
      HOTEL_POSTGRES_HOST: hotel-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOTEL_SERVICE_PORT: 8086

    depends_on:
      hotel-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8086' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  booking-service:
    # Extracted booking write path (Stage 4, Milestone 6) — lock + EXCLUDE + outbox.
    build: ./booking-service

    container_name: hms_booking

    profiles: ["app"]

    restart: unless-stopped

    ports:
      - "${BOOKING_SERVICE_PORT:-8087}:8087"

    environment:
      BOOKING_POSTGRES_DB: hotel_booking
      BOOKING_POSTGRES_HOST: booking-db
      HOTEL_SERVICE_URL: http://hotel-service:8086
      USER_SERVICE_URL: http://user-service:8088
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      BOOKING_SERVICE_PORT: 8087

    depends_on:
      booking-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8087' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  user-db:
    # User profiles database — owned exclusively by user-service.
    image: postgres:16-alpine
    container_name: hms_user_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotel_user
    ports:
      - "${USER_POSTGRES_PORT:-5435}:5432"
    volumes:
      - hms_user_pgdata:/var/lib/postgresql/data
      - ./db/user/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d hotel_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  hotel-db:
    # Catalog database — owned exclusively by hotel-service.
    image: postgres:16-alpine
    container_name: hms_hotel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotel_catalog
    ports:
      - "${HOTEL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - hms_hotel_pgdata:/var/lib/postgresql/data
      - ./db/hotel-catalog/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d hotel_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-db:
    # Booking database — owned exclusively by booking-service.
    image: postgres:16-alpine
    container_name: hms_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotel_booking
    ports:
      - "${BOOKING_POSTGRES_PORT:-5434}:5432"
    volumes:
      - hms_booking_pgdata:/var/lib/postgresql/data
      - ./db/booking/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d hotel_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Official Redis image, version 7, Alpine base. Pinned for reproducibility.
    image: redis:7-alpine

    # Stable name so `docker exec -it hms_redis redis-cli` is predictable.
    container_name: hms_redis

    restart: unless-stopped

    # Expose Redis on localhost so the Spring app (and redis-cli) can connect.
    # HOST_PORT:CONTAINER_PORT — change REDIS_PORT in .env if 6379 is taken.
    ports:
      - "${REDIS_PORT:-6379}:6379"

    # Cache hygiene baked into the container (the pitfalls we discussed):
    #   --maxmemory 256mb         : hard RAM ceiling so Redis can never OOM the box.
    #   --maxmemory-policy allkeys-lru : when full, evict the Least Recently Used
    #                                    keys. Perfect for a cache — cold data is
    #                                    dropped first, the source of truth is still
    #                                    in Postgres.
    # Note: NO volume is mounted on purpose. A cache is disposable — if Redis
    # restarts and loses everything, the app just repopulates from Postgres.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

    # "Ready" = responds to PING with PONG.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    # Official Elasticsearch 8.x — pinned for reproducible local search dev.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3

    container_name: hms_elasticsearch

    restart: unless-stopped

    environment:
      # Single-node cluster — no peer discovery needed for local dev.
      - discovery.type=single-node
      # Disable TLS/auth locally so curl and Spring connect without certificates.
      # Production MUST enable security (xpack.security.enabled=true).
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # Cap JVM heap — ES defaults can consume most of your RAM.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Allow running as root in the container on some Docker setups.
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"

    volumes:
      # Persist index data across container restarts (unlike Redis cache).
      - hms_esdata:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kibana:
    # Optional UI to inspect indices, run queries, and debug mappings.
    image: docker.elastic.co/kibana/kibana:8.15.3

    container_name: hms_kibana

    restart: unless-stopped

    depends_on:
      elasticsearch:
        condition: service_healthy

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Match elasticsearch security settings for local dev.
      - xpack.security.enabled=false

    ports:
      - "${KIBANA_PORT:-5601}:5601"

  kafka:
    # Apache Kafka 3.x in KRaft mode — no Zookeeper needed (simpler local setup).
    image: apache/kafka:3.8.1

    container_name: hms_kafka

    restart: unless-stopped

    ports:
      # Host apps (Spring Boot on your Mac) connect here.
      - "${KAFKA_PORT:-9092}:9092"
      # Kafka UI (optional) connects via the internal Docker listener below.

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: one for your Mac (localhost), one for other containers (kafka:9094).
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    # Web UI to inspect topics, messages, and consumer groups — invaluable when learning.
    image: provectuslabs/kafka-ui:latest

    container_name: hms_kafka_ui

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: "true"

  # -------------------------------------------------------------------------
  # SonarQube Community Edition (Stage 4 Milestone 4 — self-hosted quality gate)
  # Opt-in: docker compose --profile sonar up -d
  # UI: http://localhost:9000  (default login admin / admin — change on first use)
  # -------------------------------------------------------------------------
  sonar_db:
    image: postgres:16-alpine
    container_name: hms_sonar_db
    profiles: ["sonar"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    # No host port — only SonarQube reaches this DB on the compose network.
    volumes:
      - hms_sonardb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    # Community Edition — free, self-hosted. Separate from the hotel Postgres.
    image: sonarqube:lts-community
    container_name: hms_sonarqube
    profiles: ["sonar"]
    restart: unless-stopped
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Docker / CI often fails ES bootstrap checks; safe for local learning.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # Keep memory modest for local + GitHub runners (~7GB).
      SONAR_WEB_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_CE_JAVAOPTS: -Xmx512m -Xms128m
      SONAR_SEARCH_JAVAOPTS: -Xmx512m -Xms512m
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - hms_sonarqube_data:/opt/sonarqube/data
      - hms_sonarqube_extensions:/opt/sonarqube/extensions
      - hms_sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

# Named volume declaration. Docker manages where this lives on disk.
volumes:
  hms_user_pgdata:
    name: hms_user_pgdata
  hms_hotel_pgdata:
    name: hms_hotel_pgdata
  hms_booking_pgdata:
    name: hms_booking_pgdata
  hms_esdata:
    name: hms_esdata
  hms_sonardb:
    name: hms_sonardb
  hms_sonarqube_data:
    name: hms_sonarqube_data
  hms_sonarqube_extensions:
    name: hms_sonarqube_extensions
  hms_sonarqube_logs:
    name: hms_sonarqube_logs
